name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconsole --onedir `
            --name="AntigravityControlCenter" `
            --icon="assets/icons/app_icon.ico" `
            --add-data="assets;assets" `
            --add-data="src/antigravity_switcher/assets;antigravity_switcher/assets" `
            --hidden-import="PyQt5" `
            --hidden-import="PyQt5.QtWebEngineWidgets" `
            --paths="src" `
            --clean -y main.py

      - name: Package Distributable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\AntigravityControlCenter" -DestinationPath "dist\AntigravityControlCenter-Windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AntigravityControlCenter-Windows-x64.zip
          name: "Antigravity Control Center ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
